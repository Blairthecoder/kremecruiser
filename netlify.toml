[build]
  publish = "."
  command = "python3 tools/pages.py"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), microphone=(), camera=()"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[redirects]]
  from = "/index"
  to = "/"
  status = 301

[[redirects]]
  from = "/menu"
  to = "/flavors.html"
  status = 301

[[redirects]]
  from = "/book"
  to = "/contact.html"
  status = 301

[[redirects]]
  from = "/schools"
  to = "/schools-and-daycares.html"
  status = 301

[[redirects]]
  from = "/birthdays"
  to = "/birthday-parties.html"
  status = 301
