[build]
  publish = "."
  command = "python3 tools/pages.py"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), microphone=(), camera=()"

# Images are content-stable and safe to pin for a year.
[[headers]]
  for = "/assets/img/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# CSS and JS are requested with a ?v= content hash, so a new build is a new
# URL. The short max-age is a safety net for any request without the hash:
# without it a stale copy would be pinned in browsers for a year.
[[headers]]
  for = "/assets/css/*"
  [headers.values]
    Cache-Control = "public, max-age=300, must-revalidate"

[[headers]]
  for = "/assets/js/*"
  [headers.values]
    Cache-Control = "public, max-age=300, must-revalidate"

[[redirects]]
  from = "/index"
  to = "/"
  status = 301

[[redirects]]
  from = "/menu"
  to = "/flavors.html"
  status = 301

[[redirects]]
  from = "/book"
  to = "/contact.html"
  status = 301

[[redirects]]
  from = "/schools"
  to = "/schools-and-daycares.html"
  status = 301

[[redirects]]
  from = "/birthdays"
  to = "/birthday-parties.html"
  status = 301
